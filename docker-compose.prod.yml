version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    volumes:
      - app_data:/var/www/html
      - db_data:/var/www/html/database
    restart: unless-stopped

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - app_data:/var/www/html
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  app_data:
  db_data:
  caddy_data:
  caddy_config:
