version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "5173:5173" # We expose Vite's port directly on this container now
    volumes:
      - .:/app
    # Runs Laravel's server
    command: composer run dev --host=0.0.0.0 --port=8000
