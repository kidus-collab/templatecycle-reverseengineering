version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    # Run the composer 'dev' script which uses concurrently to run both PHP and Vite!
    command: sh -c "npm install && composer run dev"
